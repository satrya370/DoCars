version: "3.8"

services:
  # Web server
  nginx:
    image: nginx:1.27-alpine
    container_name: travel_nginx
    restart: unless-stopped
    depends_on:
      - php
    ports:
      - "8080:80"                       # <-- akses di http://localhost:8080
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - storage_data:/var/www/html/storage 
    networks:
      - travel_network

  # PHP-FPM (Laravel)
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: bali_tresna_travel
    restart: unless-stopped
    working_dir: /var/www/html
    expose:
      - "9000"                          # hanya dibuka ke network internal
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
      # opsional: pisahkan vendor agar tidak tabrakan dengan bind mount host
      - vendor_data:/var/www/html/vendor
       - storage_data:/var/www/html/storage
    networks:
      - travel_network
    depends_on:
      - mysql

  # Database
  mysql:
    image: mysql:8.0
    container_name: travel_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: travel_db
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: travel_user
      MYSQL_PASSWORD: travel_password
    ports:
      - "3307:3306"                     # host:container (opsional)
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - travel_network


networks:
  travel_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  vendor_data:
    driver: local
  storage_data:
    driver: local
